workflows:
  apk:
    name: TG Finder APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      java: 17
    scripts:
      - name: Generar proyecto Android
        script: |
          mkdir -p /tmp/bk && cp -r lib pubspec.yaml /tmp/bk/
          flutter create --platforms=android --org com.buscador --project-name tg_finder .
          cp -r /tmp/bk/lib/* lib/ && cp /tmp/bk/pubspec.yaml pubspec.yaml
          M=android/app/src/main/AndroidManifest.xml
          perl -pi -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          perl -pi -e 's#android:label="[^"]*"#android:label="TG Finder"#' $M
      - name: Dependencias
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
